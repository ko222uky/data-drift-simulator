# The whole system. Only the gateway publishes a port, and only on 127.0.0.1; every other
# service is reachable solely on the internal compose network.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#
# On the droplet, .env sets COMPOSE_FILE to add compose.edge.yml, which attaches the gateway
# to the shared `edge` network behind the kloworld-edge HTTPS proxy.

name: mlops-demo

x-restart: &restart
  restart: unless-stopped

services:
  gateway:
    <<: *restart
    image: caddy:2.11-alpine
    ports:
      # Loopback only: the public way in is the edge proxy, never this port.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Caddy's own state (no certificates: TLS is at the edge)
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
      auth: { condition: service_healthy }
      model: { condition: service_healthy }
      mlflow: { condition: service_started }

  frontend:
    <<: *restart
    build: ./frontend

  auth:
    <<: *restart
    build: ./services/auth
    environment:
      AUTH_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AUTH_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: ${COOKIE_SECURE:-false}

  model:
    <<: *restart
    build: ./services/model
    environment:
      MODEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/model
      MODEL_MLFLOW_TRACKING_URI: http://mlflow:5000/mlflow
      MODEL_INTERVAL_SECONDS: ${MODEL_INTERVAL_SECONDS:-5}
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }

  mlflow:
    <<: *restart
    build: ./services/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # Browser requests arrive with the public host, the model service uses mlflow:5000,
      # and the container healthcheck uses 127.0.0.1.
      MLFLOW_ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost},${PUBLIC_HOST:-localhost}:*,mlflow,mlflow:5000,localhost:*,127.0.0.1:*
      MLFLOW_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: model
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d model"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  mlflow_artifacts:
  caddy_data:
  caddy_config:
