name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab: re-runs the checks and, on main, redeploys.
  workflow_dispatch:

jobs:
  python:
    name: ${{ matrix.service }} service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, model]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose config + gateway config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: >
          docker run --rm -e SITE_ADDRESS=http://localhost
          -v "$PWD/services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Continuous deployment: after every check passes on main, deploy that exact commit.
  # The SSH key can only run the droplet's forced command (deploy/droplet/ci-deploy.sh),
  # which accepts nothing but a commit SHA already on origin/main.
  deploy:
    name: deploy to droplet
    needs: [python, frontend, compose]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false # never interrupt a deploy half-way; queue the next one
    environment:
      name: production
      url: https://datadrift.kloworld.com
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the job refuses to talk to anything but the real droplet.
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          ssh -i ~/.ssh/deploy_key
          -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
          "root@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://datadrift.kloworld.com/api/model/health
          curl -fsS -o /dev/null https://datadrift.kloworld.com/
          echo "https://datadrift.kloworld.com is up"
