name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ${{ matrix.service }} service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, model]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose config + gateway config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: >
          docker run --rm -e SITE_ADDRESS=http://localhost
          -v "$PWD/services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
